name: Testar e publicar no Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-render-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Executar smoke tests
        run: php tests/smoke.php

      - name: Validar sintaxe PHP
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Acionar deploy no Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK"
          curl --fail --silent --show-error \
            --retry 3 --retry-all-errors --max-time 30 \
            --request POST "$RENDER_DEPLOY_HOOK"
